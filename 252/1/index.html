<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>
</head>

<body>

    <h2>Daily Calorie Tracker</h2>

    <label for="calory-id">Enter calories consumed:</label>
    <input type="number" id="calory-id">

    <button onclick="addcalories()">Add Calories</button>

    <br><br>

    <label id="result">Total Calories: 0</label>
    <br><br>

    <label id="progress">Daily Goal Progress: 0%</label>
    <br><br>

    <label id="feedback">Start tracking your calories!</label>
    <br><br>

    <label id="entries">Number of Entries: 0</label>

    <script src="script.js"></script>

</body>

</html>
