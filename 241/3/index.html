<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill</title>
</head>
<body>
    <div style="width: 380px; margin: 40px auto; font-family: sans-serif; border: 1px solid #ccc; padding: 20px;">
        <h3 style="margin-top: 0;">index.html</h3>
        <form action="bill.php" method="post">
            <div style="margin-bottom: 15px;">
                <label for="location" style="display: inline-block; width: 120px;">Location:</label>
                <select name="location" id="location" style="width: 200px; padding: 4px;">
                    <option value="Dhaka">Dhaka</option>
                    <option value="Chittagong">Chittagong</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: inline-block; width: 120px;">Area:</label>
                <input type="radio" id="urban" name="area" value="Urban" checked>
                <label for="urban">Urban</label>
                &nbsp;&nbsp;
                <input type="radio" id="rural" name="area" value="Rural">
                <label for="rural">Rural</label>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="unit" style="display: inline-block; width: 120px;">Unit Consumed:</label>
                <input type="number" id="unit" name="unit" min="0" required value="213" style="width: 190px; padding: 4px;">
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" style="padding: 6px 20px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Calculate Bill
                </button>
            </div>
        </form>
    </div>
</body>
</html>
