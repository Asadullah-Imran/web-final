<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
</head>
<body>
    <h2>Number Guessing Game (500 - 5000)</h2>
    <label for="guess">Enter your guess:</label>
    <input type="text" id="guess" placeholder="500 - 5000"> 
    <br><br>
    <button id="btnSubmit" onclick="numberGuess()">Submit</button> 
    <button id="btnReset" onclick="reset()">Reset</button> 
    <br><br>
    <label id="ans"></label>

    <script src="script.js"></script>
</body>
</html>
